# ============================================================================
# SmartMove Application Configuration
# ============================================================================
spring.application.name=SmartMove Core Engine

# ============================================================================
# ACTIVE PROFILE
# ============================================================================
spring.profiles.active=develop

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=8080
server.servlet.context-path=/smartmove
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ============================================================================
# LOGGING CONFIGURATION - DEVELOPMENT
# ============================================================================

# Root logger level
logging.level.root=INFO

# SmartMove application logging (DEBUG for development)
logging.level.com.smartmove=DEBUG
logging.level.com.smartmove.service=DEBUG
logging.level.com.smartmove.controller=DEBUG
logging.level.com.smartmove.repository=DEBUG

# Spring Framework logging
logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=DEBUG

# Database/ORM logging (if using)
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG

# Log file configuration
logging.file.name=logs/smartmove.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Log pattern - Console (concise)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Log pattern - File (detailed)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log date format
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss

# ============================================================================
# ACTUATOR ENDPOINTS
# ============================================================================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================================================
# DATA FILES CONFIGURATION
# ============================================================================

# Vehicle data file
smartmove.data.vehicles-file=./data/vehicles.json

# Rental data file
smartmove.data.rentals-file=./data/rentals.json

# User data file (read-only for rental operations)
smartmove.data.users-file=./data/users.json

# ============================================================================
# AUDIT & TELEMETRY
# ============================================================================

# Audit log file
smartmove.audit.path=./data/audit_log.json
smartmove.telemetry.queue-size=50000

# ============================================================================
# CONCURRENCY
# ============================================================================

# Lock acquisition timeout (milliseconds)
smartmove.concurrency.lock-timeout-ms=5000

# ============================================================================
# JSON SERIALIZATION
# ============================================================================

# Ignore unknown properties during deserialization
spring.jackson.deserialization.fail-on-unknown-properties=false

# Include dates as timestamps
spring.jackson.serialization.write-dates-as-timestamps=true

# Default timezone for dates
spring.jackson.time-zone=UTC

# ============================================================================
# ERROR HANDLING
# ============================================================================

# Throw exception if handler not found (for 404 handling)
spring.mvc.throw-exception-if-no-handler-found=true

# Don't map resources (required for 404 handling)
spring.web.resources.add-mappings=false